<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | E-Shopper</title>
    <link
      href="{{ url_for('static', filename='css/bootstrap.min.css') }}"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='css/font-awesome.min.css') }}"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='css/prettyPhoto.css') }}"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='css/price-range.css') }}"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='css/animate.css') }}"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='css/main.css') }}"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='css/responsive.css') }}"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='images/ico/favicon.ico') }}"
    />
    <link
      rel="apple-touch-icon-precomposed"
      sizes="144x144"
      href="{{ url_for('static', filename='images/ico/apple-touch-icon-144-precomposed.png') }}"
    />
    <link
      rel="apple-touch-icon-precomposed"
      sizes="114x114"
      href="{{ url_for('static', filename='images/ico/apple-touch-icon-114-precomposed.png') }}"
    />
    <link
      rel="apple-touch-icon-precomposed"
      sizes="72x72"
      href="{{ url_for('static', filename='images/ico/apple-touch-icon-72-precomposed.png') }}"
    />
    <link
      rel="apple-touch-icon-precomposed"
      href="{{ url_for('static', filename='images/ico/apple-touch-icon-57-precomposed.png') }}"
    />
  </head>
  <body>
    {% include "layout/header.html" %}
    <main>
      {% block content %}
      <h1>Nội dung thay đổi mới trang</h1>
      {% endblock %}
    </main>
    {% include "layout/footer.html" %}
    <script src="{{ url_for('static', filename='js/jquery.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery.scrollUp.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/price-range.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery.prettyPhoto.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
